[project]
name = "vi-toolbox"
version = "0.1.0"
description = "Extensible desktop toolbox for visual inspection postprocessing of semiconductor chip images."
requires-python = ">=3.12"
license = {text = "LGPL-3.0-or-later"}

# Runtime dependencies — what the application needs to run
dependencies = [
    "PySide6>=6.7,<7",
    "PySide6-QtAds>=4.3,<5",
    "numpy>=1.26",
    # ``opencv-python-headless`` provides cv2 without bundling a second Qt
    # build (the GUI ``opencv-python`` ships its own Qt5 and conflicts with
    # PySide6).  cv2 is unconditionally imported by core/pipeline.py and the
    # OpenCV operator, so it is a hard runtime dep regardless of which OCR
    # backend is installed.
    "opencv-python-headless>=4.5",
]

# Optional dependency groups — installed only when needed
[project.optional-dependencies]
# OCR engine backends — install the one(s) you intend to use.
# Each engine is lazy-loaded at runtime, so only the installed backends
# are available in the tool's OCR engine dropdown.
ocr-paddle = [
    "paddleocr>=3.0",      # PaddlePaddle OCR engine (recommended, used in research)
    "paddlepaddle>=3.0",   # Inference backend — not declared by paddleocr as required
]
ocr-easy = [
    "easyocr>=1.7",        # EasyOCR engine (torch-based, broad language support)
]
ocr-tesseract = [
    "pytesseract>=0.3",    # Tesseract wrapper (requires Tesseract binary on PATH)
]
# Convenience: install all OCR backends at once
ocr = [
    "vi-toolbox[ocr-paddle,ocr-easy,ocr-tesseract]",
]
# Development tools: linting, formatting, testing, build automation
dev = [
    "nox>=2024.4",
    "pytest>=8.0",
    "pytest-qt>=4.4",                  # Qt widget testing helpers for pytest
    "ruff>=0.5",                       # Linter + formatter (replaces flake8, black, isort)
    "pyinstaller>=6.0",                # Packaging into portable distribution (REQ-HS-014)
    "pip-tools>=7.0",                  # Lockfile generation (pip-compile)
    "sphinx>=7.0",                     # API documentation generator
    "furo>=2024.0",                    # Modern Sphinx HTML theme
    "sphinx-autodoc-typehints>=2.0",   # Render PEP 484 type hints in docstrings
]

# Entry point: allows "python -m app" to launch the application (REQ-EC-012)
[project.scripts]
vi-toolbox = "app.__main__:main"

# ─── Build system ──────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ─── Ruff (linter + formatter) ─────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
# Exclude generated files from Qt Designer (.ui compilation output)
exclude = ["app/shell/ui/ui_*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "D",    # pydocstyle (docstring checks)
    "UP",   # pyupgrade (modern Python syntax)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"   # NumPy docstring convention (REQ-EC-006)

[tool.ruff.lint.pep8-naming]
# Qt virtual-method overrides must keep Qt's camelCase exactly — PySide6
# dispatches events by method name, so renaming breaks the override.
extend-ignore-names = [
    "eventFilter",
    "mousePressEvent",
    "mouseMoveEvent",
    "mouseReleaseEvent",
    "mouseDoubleClickEvent",
    "wheelEvent",
    "keyPressEvent",
    "keyReleaseEvent",
    "resizeEvent",
    "paintEvent",
    "closeEvent",
    "showEvent",
    "hideEvent",
    "enterEvent",
    "leaveEvent",
    "focusInEvent",
    "focusOutEvent",
    "contextMenuEvent",
    "dragEnterEvent",
    "dragMoveEvent",
    "dragLeaveEvent",
    "dropEvent",
]

# ─── pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"     # Tell pytest-qt to use PySide6
markers = [
    # End-to-end tests that need external artefacts (labelled image batches,
    # a Tesseract install). Excluded from the nox sessions via -m "not e2e";
    # run explicitly with: pytest -m e2e
    "e2e: end-to-end test requiring external fixtures and OCR backends",
]
